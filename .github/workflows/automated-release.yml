name: Automated release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if release commit
        id: skip
        run: |
          MSG=$(git log -1 --format=%B)
          if printf '%s' "$MSG" | grep -q '\[skip ci\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release commit detected — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.skip.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Show Python version
        if: steps.skip.outputs.skip != 'true'
        run: python3 --version

      - name: Configure git
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute next version and sync files
        if: steps.skip.outputs.skip != 'true'
        id: bump
        run: python3 .github/scripts/bump-version.py

      - name: Commit and tag
        id: commit_tag
        if: steps.skip.outputs.skip != 'true'
        run: |
          VERSION=$(cat .release-version 2>/dev/null || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then
            echo "No version produced; nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add .claude-plugin/marketplace.json .claude-plugin/plugin.json .codex-plugin/plugin.json skills/ansible-skill/SKILL.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin master --tags
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.commit_tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.commit_tag.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v${{ steps.commit_tag.outputs.version }}" \
            --notes-file .release-notes.md
